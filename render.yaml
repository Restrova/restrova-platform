services:
  - type: web
    name: restrova-platform
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Must live on the mounted disk below. The backend refuses to start in
      # production when DATABASE_PATH is missing or points at /tmp.
      - key: DATABASE_PATH
        value: /var/data/restaurant.db
    disk:
      name: restaurant-data
      mountPath: /var/data
      sizeGB: 1
